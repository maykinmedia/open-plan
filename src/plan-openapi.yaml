paths:
  /configuratie:
    get:
      operationId: configuratie_list
      description: Deze lijst kan gefilterd wordt met query-string parameters.
      summary: Alle configuraties opvragen.
      parameters:
      - in: query
        name: domein__uuid
        schema:
          type: string
          format: uuid
        description: Unieke resource identifier (UUID4).
      - in: query
        name: naam
        schema:
          type: string
        description: Naam van de configuratie.
      - in: query
        name: naam__icontains
        schema:
          type: string
        description: Naam van de configuratie.
      - in: query
        name: omschrijving__icontains
        schema:
          type: string
        description: Omschrijving van de configuratie.
      - name: page
        required: false
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: 'Het aantal resultaten terug te geven per pagina. (default: 100,
          maximum: 500).'
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - actief
          - niet_actief
        description: |-
          Status van de configuratie.

          * `actief` - Actief
          * `niet_actief` - Niet actief
      tags:
      - Configuratie
      security:
      - tokenAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConfiguratieList'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PaginatedConfiguratieList'
          description: ''
    post:
      operationId: configuratie_create
      description: Voeg een nieuwe configuratie toe aan het systeem.
      summary: Nieuwe configuratie aanmaken.
      tags:
      - Configuratie
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuratie'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
