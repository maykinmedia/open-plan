components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Doel:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unieke resource identifier (UUID4).
        positieUuid:
          type: string
          format: uuid
          writeOnly: true
          description: UUID van de positie.
        doeltype:
          allOf:
          - $ref: '#/components/schemas/NestedDoelType'
          readOnly: true
        doeltypeUuid:
          type: string
          format: uuid
          writeOnly: true
          description: UUID van de gekoppelde doeltype.
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Status van het doel.

            * `actief` - Actief
            * `niet_actief` - Niet actief
        naam:
          type: string
          description: Naam van het doel.
          maxLength: 255
        omschrijving:
          type: string
          description: omschrijving van het doel.
        startdatum:
          type: string
          format: date-time
          description: Startdatum van het doel.
        einddatum:
          type: string
          format: date-time
          nullable: true
          description: Einddatum van het doel.
        resultaat:
          description: |-
            Resultaat van het doel.

            * `behaald` - Behaald
            * `actief` - Actief
            * `niet_behaald` - Niet behaald
          oneOf:
          - $ref: '#/components/schemas/ResultaatEnum'
          - $ref: '#/components/schemas/BlankEnum'
        redenWijziging:
          allOf:
          - $ref: '#/components/schemas/RedenWijzigingEnum'
          description: |-
            Reden waarom het gewijzigd is.

            * `registreren` - Registreren
            * `wijzigen` - Wijzigen
            * `corrigeren` - Corrigeren
            * `herzien` - Herzien
            * `ongedaan_maken` - Ongedaan maken
            * `vernietigen` - Vernietigen
            * `overbrengen_depot` - Overbrengen depot
        voortgangToelichting:
          type: string
          description: Toelichting bij de voortgang van het doel.
          maxLength: 1000
      required:
      - doeltype
      - doeltypeUuid
      - naam
      - positieUuid
      - startdatum
      - uuid
    DoelType:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unieke resource identifier (UUID4).
        doelType:
          allOf:
          - $ref: '#/components/schemas/DoelTypeEnum'
          description: |-
            Het type doel.

            * `hoofddoel` - Hoofddoel
            * `subdoel` - Subdoel
      required:
      - doelType
      - uuid
    DoelTypeEnum:
      enum:
      - hoofddoel
      - subdoel
      type: string
      description: |-
        * `hoofddoel` - Hoofddoel
        * `subdoel` - Subdoel
