openapi: 3.0.3
info:
  title: Plannen API
  version: 0.1.0
  description: |2

    Een API voor Plannen.
  contact:
    url: https://github.com/maykinmedia/open-plan
    name: Maykin Media
    email: support@maykinmedia.nl
paths:
  /contactmoment:
    get:
      operationId: contactmoment_list
      description: Deze lijst kan gefilterd wordt met query-string parameters.
      summary: Alle contactmomenten opvragen.
      parameters:
      - in: query
        name: datum
        schema:
          type: string
          format: date-time
        description: Startdatum van het contactmoment.
      - in: query
        name: datum__gte
        schema:
          type: string
          format: date-time
        description: Startdatum van het contactmoment.
      - in: query
        name: datum__lte
        schema:
          type: string
          format: date-time
        description: Startdatum van het contactmoment.
      - name: page
        required: false
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: 'Het aantal resultaten terug te geven per pagina. (default: 100).'
        schema:
          type: integer
      - in: query
        name: persoonsprofiel
        schema:
          type: string
        description: URL naar het persoonsprofiel (alleen voor primaire personen verplicht).
      - in: query
        name: persoonsprofiel__icontains
        schema:
          type: string
        description: URL naar het persoonsprofiel (alleen voor primaire personen verplicht).
      - in: query
        name: plan__uuid
        schema:
          type: string
          format: uuid
        description: Unieke resource identifier (UUID4).
      - in: query
        name: status
        schema:
          type: string
          enum:
          - actief
          - afgebroken
          - afgerond
          - nieuw
          - pauze
        description: |-
          Status van het contactmoment.

          * `nieuw` - Nieuw
          * `actief` - Actief
          * `afgerond` - Afgerond
          * `afgebroken` - Afgebroken
          * `pauze` - Pauze
      tags:
      - Contactmoment
      security:
      - tokenAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactmomentList'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PaginatedContactmomentList'
          description: ''
    post:
      operationId: contactmoment_create
      description: Voeg een nieuw contactmoment toe aan het systeem.
      summary: Nieuw contactmoment aanmaken.
      tags:
      - Contactmoment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contactmoment'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contactmoment'
            application/problem+json:
              schema:
