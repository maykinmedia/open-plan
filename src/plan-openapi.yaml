openapi: 3.0.3
info:
  title: Plannen API
  version: 0.1.0
  description: |2

    Een API voor Plannen.
  contact:
    url: https://github.com/maykinmedia/open-plan
    name: Maykin Media
    email: support@maykinmedia.nl
  license:
    name: EUPL 1.2
    url: https://opensource.org/licenses/EUPL-1.2
paths:
  /doel:
    get:
      operationId: doel_list
      description: Deze lijst kan gefilterd wordt met query-string parameters.
      summary: Alle doelen opvragen.
      parameters:
      - in: query
        name: einddatum
        schema:
          type: string
          format: date-time
        description: Einddatum van het doel.
      - in: query
        name: einddatum__gte
        schema:
          type: string
          format: date-time
        description: Einddatum van het doel.
      - in: query
        name: einddatum__lte
        schema:
          type: string
          format: date-time
        description: Einddatum van het doel.
      - in: query
        name: naam
        schema:
          type: string
        description: Naam van het doel.
      - in: query
        name: naam__icontains
        schema:
          type: string
        description: Naam van het doel.
      - name: page
        required: false
        in: query
        description: Een pagina binnen de gepagineerde set resultaten.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: 'Het aantal resultaten terug te geven per pagina. (default: 100,
          maximum: 500).'
        schema:
          type: integer
      - in: query
        name: positie__uuid
        schema:
          type: string
          format: uuid
        description: Unieke resource identifier (UUID4).
      - in: query
        name: resultaat
        schema:
          type: string
          enum:
          - actief
          - behaald
          - niet_behaald
        description: |-
          Resultaat van het doel.

          * `behaald` - Behaald
          * `actief` - Actief
          * `niet_behaald` - Niet behaald
      - in: query
        name: startdatum
        schema:
          type: string
          format: date-time
        description: Startdatum van het doel.
      - in: query
        name: startdatum__gte
        schema:
          type: string
          format: date-time
        description: Startdatum van het doel.
      - in: query
        name: startdatum__lte
        schema:
          type: string
          format: date-time
        description: Startdatum van het doel.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - actief
          - niet_actief
        description: |-
          Status van het doel.

          * `actief` - Actief
          * `niet_actief` - Niet actief
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: string
        description: Meerdere waarden kunnen gescheiden worden door komma's.
        explode: false
        style: form
      tags:
      - Doel
      security:
      - tokenAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDoelList'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PaginatedDoelList'
          description: ''
    post:
      operationId: doel_create
      description: Voeg een nieuw doel toe aan het systeem.
      summary: Nieuw doel aanmaken.
      tags:
      - Doel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Doel'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doel'
            application/problem+json:
              schema:
