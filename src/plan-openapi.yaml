        schema:
          type: string
          format: uuid
        description: Unieke resource identifier (UUID4).
      - in: query
        name: plannen__uuid__in
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: UUID's van de gekoppelde plannen.
        explode: false
        style: form
      - in: query
        name: resultaat
        schema:
          type: string
          enum:
          - behaald
          - gefaald
        description: |-
          Resultaat van het doel.

          * `behaald` - Behaald
          * `gefaald` - Gefaald
      - in: query
        name: startdatum
        schema:
          type: string
          format: date-time
        description: Startdatum van het doel.
      - in: query
        name: startdatum__gte
        schema:
          type: string
          format: date-time
        description: Startdatum van het doel.
      - in: query
        name: startdatum__lte
        schema:
          type: string
          format: date-time
        description: Startdatum van het doel.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - actief
          - afgebroken
          - afgerond
          - nieuw
          - pauze
        description: |-
          Status van het doel.

          * `nieuw` - Nieuw
          * `actief` - Actief
          * `afgerond` - Afgerond
          * `afgebroken` - Afgebroken
          * `pauze` - Pauze
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: string
        description: Meerdere waarden kunnen gescheiden worden door komma's.
        explode: false
        style: form
      - in: query
        name: titel
        schema:
          type: string
        description: Titel van het doel.
      - in: query
        name: titel__icontains
        schema:
          type: string
        description: Titel van het doel.
      tags:
      - Doel
      security:
      - tokenAuth: []
