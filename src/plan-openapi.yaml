components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Contactmoment:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unieke resource identifier (UUID4).
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Status van het contactmoment.

            * `nieuw` - Nieuw
            * `actief` - Actief
            * `afgerond` - Afgerond
            * `afgebroken` - Afgebroken
            * `pauze` - Pauze
        datum:
          type: string
          format: date-time
          description: Startdatum van het contactmoment.
        toelichtingStatus:
          type: string
          description: Toelichting bij de status van het contactmoment.
          maxLength: 1000
        notitie:
          type: string
          description: Notitie bij het contactmoment.
          maxLength: 1000
        plan:
          allOf:
          - $ref: '#/components/schemas/NestedPlan'
          readOnly: true
        planUuid:
          type: string
          format: uuid
          writeOnly: true
          description: UUID van het plan waarbij dit contactmoment hoort.
      required:
      - datum
      - plan
      - planUuid
      - uuid
    Doel:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unieke resource identifier (UUID4).
        plannen:
          type: array
          items:
            $ref: '#/components/schemas/NestedPlan'
          readOnly: true
        plannenUuids:
          type: array
          items:
            type: string
            format: uuid
            writeOnly: true
          writeOnly: true
          description: UUID van de plannen waaraan dit doel gekoppelt is.
        doeltype:
          allOf:
          - $ref: '#/components/schemas/NestedDoelType'
          readOnly: true
        doeltypeUuid:
          type: string
          format: uuid
          writeOnly: true
          description: UUID van de gekoppelde doeltype.
        subject:
          allOf:
          - $ref: '#/components/schemas/Subject'
          readOnly: true
        subjectUuid:
          type: string
          format: uuid
          writeOnly: true
          description: UUID van de gekoppelde subject.
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Status van het doel.

            * `nieuw` - Nieuw
            * `actief` - Actief
            * `afgerond` - Afgerond
            * `afgebroken` - Afgebroken
            * `pauze` - Pauze
        titel:
          type: string
          description: Titel van het doel.
          maxLength: 255
        beschrijving:
          type: string
          description: Beschrijving van het doel.
          maxLength: 1000
        startdatum:
          type: string
          format: date-time
          description: Startdatum van het doel.
        einddatum:
          type: string
          format: date-time
          nullable: true
          description: Einddatum van het doel.
        resultaat:
          description: |-
            Resultaat van het doel.

            * `behaald` - Behaald
            * `gefaald` - Gefaald
