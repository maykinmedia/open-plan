components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Configuratie:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unieke resource identifier (UUID4).
        domein:
          allOf:
          - $ref: '#/components/schemas/Domein'
          readOnly: true
        domeinUuid:
          type: string
          format: uuid
          writeOnly: true
          description: UUID van het gekoppelde domein.
        naam:
          type: string
          description: Naam van de configuratie.
          maxLength: 255
        omschrijving:
          type: string
          description: Omschrijving van de configuratie.
          maxLength: 1000
        status:
          allOf:
          - $ref: '#/components/schemas/TypeStatus'
          description: |-
            Status van de configuratie.

            * `actief` - Actief
            * `niet_actief` - Niet actief
      required:
      - domein
      - domeinUuid
      - naam
      - uuid
    Doel:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unieke resource identifier (UUID4).
        positieUuid:
          type: string
          format: uuid
          writeOnly: true
          description: UUID van de positie.
        doeltype:
          allOf:
          - $ref: '#/components/schemas/NestedDoelType'
          readOnly: true
        doeltypeUuid:
          type: string
          format: uuid
          writeOnly: true
          description: UUID van de gekoppelde doeltype.
        status:
          allOf:
          - $ref: '#/components/schemas/TypeStatus'
          description: |-
            Status van het doel.

            * `actief` - Actief
            * `niet_actief` - Niet actief
        naam:
          type: string
          description: Naam van het doel.
          maxLength: 255
        omschrijving:
          type: string
          description: omschrijving van het doel.
        startdatum:
          type: string
          format: date
          description: Startdatum van het doel.
        einddatum:
          type: string
          format: date
          nullable: true
          description: Einddatum van het doel.
        beoogdeStartdatum:
          type: string
          format: date
          description: Beoogde startdatum van het doel.
        beoogdeEinddatum:
          type: string
          format: date
          nullable: true
          description: Beoogde einddatum van het doel.
        gewijzigdOp:
          type: string
          format: date-time
          readOnly: true
          description: Datum en tijd waarop het doel voor het laatst is gewijzigd.
        resultaat:
          description: |-
            Resultaat van het doel.

            * `behaald` - Behaald
            * `actief` - Actief
            * `niet_behaald` - Niet behaald
          oneOf:
          - $ref: '#/components/schemas/ResultaatEnum'
          - $ref: '#/components/schemas/BlankEnum'
        redenWijziging:
          allOf:
          - $ref: '#/components/schemas/RedenWijzigingEnum'
          description: |-
            Reden waarom het gewijzigd is.

            * `registreren` - Registreren
            * `wijzigen` - Wijzigen
            * `corrigeren` - Corrigeren
            * `herzien` - Herzien
            * `ongedaan_maken` - Ongedaan maken
            * `vernietigen` - Vernietigen
            * `overbrengen_depot` - Overbrengen depot
        toelichtingReden:
          type: string
          description: Toelichting reden wijziging van het doel.
          maxLength: 1000
      required:
      - beoogdeStartdatum
      - doeltype
      - doeltypeUuid
      - gewijzigdOp
      - naam
      - positieUuid
      - startdatum
      - uuid
    DoelStatus:
      enum:
      - gepland
      - gestart
      - behaald
      - afgebroken
      type: string
      description: |-
        * `gepland` - Gepland
        * `gestart` - Gestart
        * `behaald` - Behaald
        * `afgebroken` - Afgebroken
    DoelType:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Unieke resource identifier (UUID4).
        naam:
          type: string
          description: Naam van het doeltype.
          maxLength: 255
        omschrijving:
          type: string
          description: Omschrijving van het doeltype.
          maxLength: 1000
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Status van het doeltype.

